{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Melt & Munch</title>

    <link rel="stylesheet" href="{% static 'dashboard/css/admin_login.css' %}">
</head>
<body>

<div class="login-page">

    <div class="decoration decoration-one">🍓</div>
    <div class="decoration decoration-two">🍦</div>
    <div class="decoration decoration-three">🍒</div>
    <div class="decoration decoration-four">🍫</div>

    <div class="login-card">

        <div class="brand-icon">🍨</div>

        <p class="welcome-text">WELCOME BACK, ADMIN!</p>

        <h1>Melt <span>&</span> Munch</h1>

        <p class="subtitle">
            A little sweetness begins with you 💗
        </p>

        <div class="admin-tag">✨ ADMIN PORTAL ✨</div>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your admin username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                    <button type="button" id="togglePassword">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Login to Dashboard <span>→</span>
            </button>
        </form>

        <p class="footer-text">
            Made with love and sprinkles 💕
        </p>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to Website
        </a>

    </div>
</div>

<script src="{% static 'dashboard/js/admin_login.js' %}"></script>
</body>
</html>
